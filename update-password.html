<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#169AC4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bontang Akuatik">
  <link rel="icon" type="image/png" href="assets/images/logo.webp">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.webp">

  <link rel="stylesheet" href="assets/css/global.css?v=20260907d">
  <link rel="stylesheet" href="assets/css/navbar.css?v=20260907d">

  <link rel="stylesheet" href="assets/css/pwa.css?v=20260907d">
  <link rel="stylesheet" href="assets/css/components.css?v=20260907d">
  <link rel="stylesheet" href="assets/css/components-v2.css?v=20260907d">
</head>

<body>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="icon">🔐</div>
          <h1>Ganti Password</h1>
          <p>Buat password baru yang lebih kuat untuk akun Anda</p>
        </div>

        <div class="auth-body">

          <div class="app-banner app-banner--warning app-banner--inline" id="up-alert" hidden>
            <div class="app-banner__icon" aria-hidden="true">⚠️</div>
            <div class="app-banner__body">
              <strong>Password Anda belum memenuhi standar keamanan</strong>
              <span>Perbarui sekarang agar akun Anda tetap aman.</span>
            </div>
          </div>

          <div class="up-identity">
            <div><span>Nama</span><strong id="up-nama">-</strong></div>
            <div><span>Username</span><strong id="up-username">-</strong></div>
            <div><span>Peran</span><strong id="up-peran">-</strong></div>
          </div>

          <form id="form-update-password" novalidate>
            <div class="form-group">
              <label for="up-current">Password Saat Ini *</label>
              <div class="password-wrap">
                <input type="password" id="up-current" class="form-control" required
                       placeholder="Password yang Anda pakai sekarang" autocomplete="current-password">
                <button type="button" class="password-toggle" data-password-toggle="up-current"></button>
              </div>
            </div>

            <div class="form-group">
              <label for="up-new">Password Baru *</label>
              <div class="password-wrap">
                <input type="password" id="up-new" class="form-control" required
                       placeholder="Password baru Anda" autocomplete="new-password">
                <button type="button" class="password-toggle" data-password-toggle="up-new"></button>
              </div>
              <div class="pw-checklist" id="up-checklist"></div>
            </div>

            <div class="form-group">
              <label for="up-confirm">Konfirmasi Password Baru *</label>
              <div class="password-wrap">
                <input type="password" id="up-confirm" class="form-control" required
                       placeholder="Ulangi password baru" autocomplete="new-password">
                <button type="button" class="password-toggle" data-password-toggle="up-confirm"></button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="up-submit" disabled>Simpan Password Baru</button>
            <button type="button" class="btn btn-secondary btn-block" id="up-cancel"
                    style="margin-top:10px;">Kembali ke Dashboard</button>
          </form>

        </div>
      </div>
    </div>
  </div>

</body>
