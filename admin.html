  <!-- Sprite ikon, didefinisikan sekali lalu dipakai ulang lewat <use> -->

  <div class="admin-page">
    <div class="container">

      <!-- Tugas yang perlu ditindaklanjuti -->
      <section class="task-section" id="task-section" hidden aria-label="Tugas yang perlu ditindaklanjuti">
        <div class="task-section-head">
          <h2 class="task-section-title">
            <svg class="ic" aria-hidden="true"><use href="#ic-info"/></svg>
            <span id="task-title">Tugas Penting</span>
            <span class="task-count-badge" id="task-count">0</span>
          </h2>
          <p class="task-section-sub">Ketuk kartu untuk menindaklanjuti</p>
        </div>
        <div class="task-scroller" id="task-scroller"></div>
      </section>

      <!-- Navigasi tab (desktop) -->
      <div class="tabs" id="admin-tabs" role="tablist" aria-label="Bagian panel admin">
        <button class="tab active" role="tab" aria-selected="true" data-tab="peserta" data-icon="ic-person">
          <svg class="ic" aria-hidden="true"><use href="#ic-person"/></svg><span>Peserta</span>
        </button>
        <button class="tab" role="tab" aria-selected="false" data-tab="jadwal" data-icon="ic-calendar">
          <svg class="ic" aria-hidden="true"><use href="#ic-calendar"/></svg><span>Jadwal</span>
        </button>
        <button class="tab" role="tab" aria-selected="false" data-tab="kehadiran" data-icon="ic-check-circle">
          <svg class="ic" aria-hidden="true"><use href="#ic-check-circle"/></svg><span>Kehadiran</span>
        </button>
        <button class="tab" role="tab" aria-selected="false" data-tab="rapor" data-icon="ic-doc">
          <svg class="ic" aria-hidden="true"><use href="#ic-doc"/></svg><span>Rapor</span>
        </button>
        <button class="tab" role="tab" aria-selected="false" data-tab="berita" data-icon="ic-news">
          <svg class="ic" aria-hidden="true"><use href="#ic-news"/></svg><span>Berita</span>
        </button>
        <button class="tab" role="tab" aria-selected="false" data-tab="pelatih" data-icon="ic-users" data-role="superadmin" hidden>
          <svg class="ic" aria-hidden="true"><use href="#ic-users"/></svg><span>Pelatih</span>
        </button>
      </div>

      <!-- ============== PESERTA ============== -->
      <div class="tab-content active" id="tab-peserta" role="tabpanel">
        <div class="notice-strip" id="nomor-notice" hidden></div>

        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-wrap">
              <svg class="ic search-ic" aria-hidden="true"><use href="#ic-search"/></svg>
              <input type="text" id="search-peserta" class="search-input"
                     placeholder="Cari nama, username, nomor peserta..." aria-label="Cari peserta">
            </div>
            <div class="select-wrap">
              <select id="filter-kelas-peserta" class="filter-select" aria-label="Filter grup">
                <option value="all">Semua Grup</option>
                <option value="Grup A">Grup A</option>
                <option value="Grup B">Grup B</option>
                <option value="Grup C">Grup C</option>
              </select>
              <svg class="ic select-caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg>
            </div>
            <div class="select-wrap">
              <select id="filter-status-peserta" class="filter-select" aria-label="Filter status pembayaran">
                <option value="all">Semua Status</option>
                <option value="paid">Lunas</option>
                <option value="unpaid">Belum Lunas</option>
                <option value="pending">Menunggu Konfirmasi</option>
                <option value="expired">Periode Berakhir</option>
              </select>
              <svg class="ic select-caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg>
            </div>
          </div>
        </div>

        <!-- <p class="table-hint" id="peserta-hint"></p> -->

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Nama</th><th>Usia</th><th>Grup</th>
                  <th>Pembayaran</th><th class="th-actions">Aksi</th></tr>
            </thead>
            <tbody id="tbody-peserta"></tbody>
          </table>
        </div>
        <div id="pager-peserta"></div>
      </div>

      <!-- ============== JADWAL ============== -->
      <div class="tab-content" id="tab-jadwal" role="tabpanel">
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-wrap">
              <svg class="ic search-ic" aria-hidden="true"><use href="#ic-search"/></svg>
              <input type="text" id="search-jadwal" class="search-input"
                     placeholder="Cari tanggal, lokasi, pelatih..." aria-label="Cari jadwal">
            </div>
            <div class="select-wrap">
              <select id="filter-kelas-jadwal" class="filter-select" aria-label="Filter grup">
                <option value="all">Semua Grup</option>
                <option value="Grup A">Grup A</option>
                <option value="Grup B">Grup B</option>
                <option value="Grup C">Grup C</option>
              </select>
              <svg class="ic select-caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg>
            </div>
            <div class="select-wrap">
              <select id="filter-status-jadwal" class="filter-select" aria-label="Filter status sesi">
                <option value="all">Semua Status</option>
                <option value="Aktif">Berlangsung</option>
                <option value="Pending">Belum Dibuka</option>
                <option value="Selesai">Selesai</option>
                <option value="Cancel">Dibatalkan</option>
              </select>
              <svg class="ic select-caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg>
            </div>
            <div class="select-wrap">
              <select id="filter-tipe-jadwal" class="filter-select" aria-label="Filter jenis jadwal">
                <option value="all">Semua Jenis</option>
                <option value="kelas">Jadwal Grup</option>
                <option value="personal">Personal</option>
                <option value="mine">Delegasi Saya</option>
              </select>
              <svg class="ic select-caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg>
            </div>
            <div class="ui-segment ui-segment--sm" id="jadwal-view-toggle" role="group" aria-label="Tampilan jadwal">
              <button type="button" data-val="list" class="active">☰ List</button>
              <button type="button" data-val="calendar">📅 Kalender</button>
            </div>
          </div>
          <button class="btn btn-primary btn-icon" id="btn-tambah-jadwal">
            <svg class="ic" aria-hidden="true"><use href="#ic-plus"/></svg><span>Jadwal Personal</span>
          </button>
        </div>

        <div class="table-wrap" id="jadwal-table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Tanggal</th><th>Jam</th><th>Grup</th><th>Jenis</th>
                  <th>Pelatih</th><th>Status</th><th class="th-actions">Aksi</th></tr>
            </thead>
            <tbody id="tbody-jadwal"></tbody>
          </table>
        </div>
        <div id="pager-jadwal"></div>
        <div class="admin-calendar" id="jadwal-calendar-view" hidden></div>
      </div>

      <!-- ============== KEHADIRAN ============== -->
      <div class="tab-content" id="tab-kehadiran" role="tabpanel">

            <div class="search-wrap">

              <select id="filter-kelas-kehadiran" class="filter-select" aria-label="Filter grup">
                <option value="all">Semua Grup</option>
                <option value="Grup A">Grup A</option>
                <option value="Grup B">Grup B</option>
                <option value="Grup C">Grup C</option>
              </select>
              <svg class="ic select-caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg>
            </div>
            <div class="select-wrap">
              <select id="filter-status-kehadiran" class="filter-select" aria-label="Filter status">
                <option value="all">Semua Status</option>
                <option value="hadir">Hadir</option>
                <option value="izin">Izin</option>
              </select>
              <svg class="ic select-caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg>
            </div>
            <div class="select-wrap">
              <select id="filter-periode" class="filter-select" aria-label="Filter periode">
                <option value="all">Semua Periode</option>
                <option value="minggu">7 Hari Terakhir</option>
                <option value="bulan">Bulan Ini</option>
                <option value="tahun">Tahun Ini</option>
              </select>
              <svg class="ic select-caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg>
            </div>
            <div class="ui-segment ui-segment--sm" id="kehadiran-view-toggle" role="group" aria-label="Tampilan kehadiran">
              <button type="button" data-val="list" class="active">☰ List</button>
              <button type="button" data-val="table">▦ Tabel</button>
            </div>
          </div>
          <button class="btn btn-primary btn-icon" id="btn-export-kehadiran">
            <svg class="ic" aria-hidden="true"><use href="#ic-download"/></svg><span>Export Excel</span>

            <thead>

            <tbody id="tbody-kehadiran"></tbody>
          </table>
        </div>
        <div id="pager-kehadiran"></div>
        <div class="admin-pivot" id="kehadiran-pivot-view" hidden></div>
      </div>

      <!-- ============== RAPOR ============== -->
      <div class="tab-content" id="tab-rapor" role="tabpanel">
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-wrap">
              <svg class="ic search-ic" aria-hidden="true"><use href="#ic-search"/></svg>

                <option value="Grup B">Grup B</option>
                <option value="Grup C">Grup C</option>

              <svg class="ic select-caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg>
            </div>
            <div class="select-wrap">
              <select id="filter-status-rapor" class="filter-select" aria-label="Filter status rapor">
                <option value="all">Semua Status</option>
                <option value="sudah">Sudah Ada Rapor</option>
                <option value="belum">Belum Ada Rapor</option>
              </select>
              <svg class="ic select-caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg>
            </div>
            <div class="select-wrap">
              <select id="filter-predikat-rapor" class="filter-select" aria-label="Filter predikat">
                <option value="all">Semua Predikat</option>
              </select>
              <svg class="ic select-caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg>
            </div>
            <div class="select-wrap">
              <select id="sort-rapor" class="filter-select" aria-label="Urutkan rapor">

              </select>
              <svg class="ic select-caret" aria-hidden="true"><use href="#ic-chevron-down"/></svg>
            </div>
          </div>
          <button class="btn btn-primary btn-icon" id="btn-arsip-rapor" data-role="superadmin" hidden>
            <svg class="ic" aria-hidden="true"><use href="#ic-download"/></svg><span>Unduh Arsip ZIP</span>
          </button>
        </div>

        <!-- <p class="table-hint" id="rapor-hint"></p> -->

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Peserta</th><th>Predikat</th><th>Catatan</th>
                  <th>Diperbarui</th><th>Status</th><th class="th-actions">Aksi</th></tr>
            </thead>
            <tbody id="tbody-rapor"></tbody>
          </table>
        </div>
        <div id="pager-rapor"></div>
      </div>

      <!-- ============== BERITA ============== -->
      <div class="tab-content" id="tab-berita" role="tabpanel">
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-wrap">
              <svg class="ic search-ic" aria-hidden="true"><use href="#ic-search"/></svg>
              <input type="text" id="search-berita" class="search-input"

            <div class="select-wrap">
              <select id="filter-penulis-berita" class="filter-select" aria-label="Filter penulis">

          <button class="btn btn-primary btn-icon" id="btn-tambah-berita">

          <button class="btn btn-primary btn-icon" id="btn-tambah-pelatih">

        <div class="table-wrap">

            </thead>
            <tbody id="tbody-pelatih"></tbody>
          </table>
        </div>
        <div id="pager-pelatih"></div>
      </div>

    </div>
