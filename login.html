  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Bontang Akuatik</title>
  <meta name="description" content="Masuk ke akun Bontang Akuatik Anda untuk melihat jadwal latihan, melakukan absensi, dan rapor latihan.">
  <meta name="robots" content="noindex, follow">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#169AC4">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="Bontang Akuatik">
  <link rel="icon" type="image/png" href="assets/images/logo.webp">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.webp">

<body>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="icon">🔐</div>
          <h1>Selamat Datang Kembali</h1>
          <p>Masuk untuk mengakses dashboard Anda</p>
        </div>

        <div class="auth-body">
          <form id="form-login" novalidate>
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" name="username" id="username" class="form-control" required
                     placeholder="Nama panggilan Anda" autocomplete="username">
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="password-wrap">
                <input type="password" name="password" id="password" class="form-control" required
                       placeholder="Password Anda" autocomplete="current-password">
                <button type="button" id="togglePassword" class="password-toggle"></button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Masuk</button>
            <p class="form-helper" id="login-status" role="status" style="text-align:center;margin-top:10px;"></p>
          </form>

          <div class="auth-forgot"><a href="forgot-password.html">Lupa password?</a></div>
        </div>

        <div class="auth-footer">
          Belum punya akun? <a href="registrasi.html">Daftar sekarang</a>
        </div>
      </div>
    </div>
  </div>
